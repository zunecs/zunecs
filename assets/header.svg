<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#FFFFFF" fill-opacity="0.2"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFF" stop-opacity="1"/>
    </linearGradient>
    <mask id="fadeMask"><rect x="760" y="0" width="440" height="300" fill="url(#fade)"/></mask>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E86A33" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E86A33" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E86A33" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="#0B0B0C"/>

  <g stroke="#FFFFFF" stroke-opacity="0.05">
    <line x1="0" y1="75" x2="1200" y2="75"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="225" x2="1200" y2="225"/>
    <line x1="300" y1="0" x2="300" y2="300"/>
    <line x1="600" y1="0" x2="600" y2="300"/>
    <line x1="900" y1="0" x2="900" y2="300"/>
  </g>

  <rect x="760" y="0" width="440" height="300" fill="url(#dots)" mask="url(#fadeMask)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="6s" repeatCount="indefinite"/>
  </rect>

  <rect x="-260" y="0" width="260" height="300" fill="url(#sweep)">
    <animate attributeName="x" from="-260" to="1200" dur="7s" repeatCount="indefinite"/>
  </rect>

  <text x="80" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="12" letter-spacing="7" fill="#E86A33" opacity="0">
    ARTIFICIAL INTELLIGENCE
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.2s" fill="freeze"/>
  </text>

  <text x="80" y="162" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="60" font-weight="200" letter-spacing="11" fill="#FAFAFA" opacity="0">
    ABDULRAHMAN
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.5s" fill="freeze"/>
    <animate attributeName="letter-spacing" from="22" to="11" dur="1.4s" begin="0.5s" fill="freeze"/>
  </text>

  <rect x="82" y="190" width="0" height="2" fill="#E86A33">
    <animate attributeName="width" from="0" to="72" dur="0.7s" begin="1.4s" fill="freeze"/>
  </rect>

  <text x="80" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="15" letter-spacing="4" fill="#8B949E" opacity="0">
    AGENTIC SYSTEMS · INTELLIGENT AUTOMATION
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.7s" fill="freeze"/>
  </text>

  <circle cx="1120" cy="252" r="4" fill="#E86A33">
    <animate attributeName="opacity" values="1;0.15;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="1100" y="256" text-anchor="end" font-family="ui-monospace, monospace"
        font-size="11" letter-spacing="3" fill="#8B949E">DHAHRAN, SA</text>
</svg>
