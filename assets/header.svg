<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E7C7B"/>
      <stop offset="100%" stop-color="#6C63C4"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E7C7B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0E7C7B" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#0E7C7B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5F4F0" stop-opacity="1"/>
      <stop offset="30%" stop-color="#F5F4F0" stop-opacity="0"/>
    </linearGradient>

    <path id="e1" d="M820,104 L936,72"/>
    <path id="e2" d="M820,104 L936,168"/>
    <path id="e3" d="M936,72 L1058,116"/>
    <path id="e4" d="M936,168 L1058,116"/>
    <path id="e5" d="M936,168 L1058,222"/>
    <path id="e6" d="M820,104 L902,242"/>
    <path id="e7" d="M902,242 L936,168"/>
  </defs>

  <rect width="1200" height="320" fill="#F5F4F0"/>

  <g stroke="#141413" stroke-opacity="0.05">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

  <rect x="-280" y="0" width="280" height="320" fill="url(#sweep)">
    <animate attributeName="x" from="-280" to="1200" dur="8s" repeatCount="indefinite"/>
  </rect>

  <g stroke="url(#accent)" stroke-width="1.2" stroke-opacity="0.45" fill="none"
     stroke-dasharray="4 4">
    <use href="#e1"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="1.6s" repeatCount="indefinite"/></use>
    <use href="#e2"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="1.9s" repeatCount="indefinite"/></use>
    <use href="#e3"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="1.4s" repeatCount="indefinite"/></use>
    <use href="#e4"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="2.1s" repeatCount="indefinite"/></use>
    <use href="#e5"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="1.7s" repeatCount="indefinite"/></use>
    <use href="#e6"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="2.3s" repeatCount="indefinite"/></use>
    <use href="#e7"><animate attributeName="stroke-dashoffset" from="16" to="0" dur="1.5s" repeatCount="indefinite"/></use>
  </g>

  <g fill="#0E7C7B">
    <circle r="3.5"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="3.4s" begin="0.6s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
    <circle r="3.5" fill="#6C63C4"><animateMotion dur="2.4s" begin="1.1s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
    <circle r="3.5" fill="#6C63C4"><animateMotion dur="3.1s" begin="0.3s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion></circle>
    <circle r="3.5"><animateMotion dur="3.8s" begin="1.4s" repeatCount="indefinite"><mpath href="#e6"/></animateMotion></circle>
  </g>

  <g fill="#F5F4F0" stroke="url(#accent)" stroke-width="1.8">
    <circle cx="820" cy="104" r="8"><animate attributeName="r" values="8;10;8" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="936" cy="72" r="6"><animate attributeName="r" values="6;8;6" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="936" cy="168" r="9"><animate attributeName="r" values="9;11;9" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1058" cy="116" r="6"><animate attributeName="r" values="6;8;6" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1058" cy="222" r="6"><animate attributeName="r" values="6;8;6" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="902" cy="242" r="6"><animate attributeName="r" values="6;8;6" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="760" y="0" width="60" height="320" fill="url(#edgeFade)"/>

  <text x="80" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" letter-spacing="7" fill="#0E7C7B" opacity="0">
    ARTIFICIAL INTELLIGENCE
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.2s" fill="freeze"/>
  </text>

  <text x="78" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="62" font-weight="200" letter-spacing="12" fill="#141413" opacity="0">
    ABDULRAHMAN
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.5s" fill="freeze"/>
    <animate attributeName="letter-spacing" from="24" to="12" dur="1.4s" begin="0.5s" fill="freeze"/>
  </text>

  <rect x="80" y="200" width="0" height="2.5" fill="url(#accent)">
    <animate attributeName="width" from="0" to="96" dur="0.8s" begin="1.4s" fill="freeze"/>
  </rect>

  <text x="80" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="14" letter-spacing="4" fill="#78766F" opacity="0">
    AGENTIC SYSTEMS · INTELLIGENT AUTOMATION
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.7s" fill="freeze"/>
  </text>

  <circle cx="86" cy="278" r="3.5" fill="#0E7C7B">
    <animate attributeName="opacity" values="1;0.15;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="102" y="282" font-family="ui-monospace, monospace"
        font-size="11" letter-spacing="3" fill="#78766F">DHAHRAN, SAUDI ARABIA</text>
</svg>
