<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5EFE3"/>
      <stop offset="100%" stop-color="#EADFC9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#B4552D" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#B4552D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#warm)"/>
  <rect width="1200" height="340" filter="url(#grain)" opacity="0.055"/>
  <circle cx="985" cy="170" r="190" fill="url(#glow)"/>

  <!-- orbital compass motif -->
  <g transform="translate(985,170)">
    <circle r="118" fill="none" stroke="#2E2A25" stroke-opacity="0.10" stroke-width="1"/>
    <circle r="86" fill="none" stroke="#2E2A25" stroke-opacity="0.13" stroke-width="1"/>
    <circle r="52" fill="none" stroke="#2E2A25" stroke-opacity="0.16" stroke-width="1"/>

    <g fill="none" stroke="#B4552D" stroke-width="1.6" stroke-opacity="0.75"
       stroke-linecap="round" stroke-dasharray="60 250">
      <circle r="118">
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="34s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="none" stroke="#6F7F63" stroke-width="1.6" stroke-opacity="0.8"
       stroke-linecap="round" stroke-dasharray="40 180">
      <circle r="86">
        <animateTransform attributeName="transform" type="rotate"
                          from="360" to="0" dur="24s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="none" stroke="#A8705C" stroke-width="1.4" stroke-opacity="0.7"
       stroke-linecap="round" stroke-dasharray="26 100">
      <circle r="52">
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="16s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0" to="360" dur="34s" repeatCount="indefinite"/>
      <circle cx="118" cy="0" r="4.5" fill="#B4552D"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="180" to="540" dur="24s" repeatCount="indefinite"/>
      <circle cx="86" cy="0" r="3.5" fill="#6F7F63"/>
    </g>

    <circle r="5" fill="#2E2A25">
      <animate attributeName="r" values="5;7;5" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- masthead -->
  <line x1="80" y1="70" x2="80" y2="70" stroke="#2E2A25" stroke-opacity="0.35" stroke-width="1">
    <animate attributeName="x2" from="80" to="700" dur="1s" begin="0.1s" fill="freeze"/>
  </line>

  <text x="80" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="10.5" letter-spacing="5.5" fill="#8A8175" opacity="0">
    PORTFOLIO · MMXXVI · DHAHRAN, SAUDI ARABIA
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.3s" fill="freeze"/>
  </text>

  <text x="76" y="168" font-family="Georgia, 'Times New Roman', serif"
        font-size="76" font-weight="400" letter-spacing="1" fill="#2E2A25" opacity="0">
    Abdulrahman
    <animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="0.6s" fill="freeze"/>
    <animate attributeName="letter-spacing" from="9" to="1" dur="1.5s" begin="0.6s" fill="freeze"/>
  </text>

  <text x="80" y="206" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="21" fill="#B4552D" opacity="0">
    Artificial Intelligence · Agentic Systems
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.3s" fill="freeze"/>
  </text>

  <line x1="80" y1="238" x2="80" y2="238" stroke="#B4552D" stroke-width="2">
    <animate attributeName="x2" from="80" to="188" dur="0.8s" begin="1.6s" fill="freeze"/>
  </line>

  <text x="80" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11.5" letter-spacing="3" fill="#8A8175" opacity="0">
    BUILDING SYSTEMS THAT READ, DECIDE, AND ACT
    <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="1.9s" fill="freeze"/>
  </text>
</svg>
